name: Continuous Release
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm -r --filter @ensdomains/ensjs-abi --filter @ensdomains/ensjs build

      - name: Publish to pkg.pr.new
        run: pnpm dlx pkg-pr-new publish "./packages/ensjs-abi" "./packages/ensjs"
